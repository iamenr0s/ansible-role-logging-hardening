---
argument_specs:
  main:
    short_description: Audit and apply journald and rsyslog hardening through drop-ins.
    options:
      linux_hardening_mode: {type: str, default: audit, choices: [audit, remediate], description: "audit is read-only."}
      linux_hardening_confirm_remediation: {type: bool, default: false, description: "Must be true before remediate changes anything."}
      linux_hardening_backup: {type: bool, default: true, description: "Back up a drop-in when it changes."}
      linux_hardening_verify: {type: bool, default: true, description: "Re-audit after remediation."}
      linux_hardening_fail_on_error: {type: bool, default: true, description: "Fail the play when audit finds deviations."}
      linux_hardening_logging_enabled: {type: bool, default: true, description: "Run the role."}
      linux_hardening_logging_journald_dropin: {type: path, default: /etc/systemd/journald.conf.d/99-linux-hardening.conf, description: "journald drop-in."}
      linux_hardening_logging_rsyslog_dropin: {type: path, default: /etc/rsyslog.d/99-linux-hardening.conf, description: "rsyslog drop-in."}
      linux_hardening_logging_journald: {type: dict, default: {}, description: "[Journal] settings to add or change; null drops a built-in one."}
      linux_hardening_logging_rsyslog_file_mode: {type: str, default: "0640", description: "rsyslog $FileCreateMode."}
