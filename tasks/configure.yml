---
- name: configure | Build the list of drop-ins
  ansible.builtin.include_tasks: facts.yml

- name: configure | Ensure the drop-in directories exist
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ __lh_log_files }}"
  loop_control:
    label: "{{ item.name }}"

- name: configure | Write the drop-ins
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
    backup: "{{ linux_hardening_backup | bool }}"
  loop: "{{ __lh_log_files }}"
  loop_control:
    label: "{{ item.name }}"
  register: __lh_log_written

- name: configure | Restart journald when its drop-in changed
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  when: __lh_log_written.results | selectattr('item.name', 'eq', 'journald') | selectattr('changed') | list | length > 0

- name: configure | Gather service state
  ansible.builtin.service_facts:
  when: __lh_log_written.results | selectattr('item.name', 'eq', 'rsyslog') | selectattr('changed') | list | length > 0

# Only a running rsyslog is restarted; an installed but stopped one picks the drop-in up when it starts.
- name: configure | Restart rsyslog when its drop-in changed
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  when:
    - __lh_log_written.results | selectattr('item.name', 'eq', 'rsyslog') | selectattr('changed') | list | length > 0
    - ansible_facts['services']['rsyslog.service']['state'] | default('') == 'running'
